[project]
name = "amr-ssi-ecsa-extraction"
version = "0.1.0"
description = "Reproducible PDF-to-JSON data extraction pipeline for the ECSA SSI/AMR systematic review"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "rapidocr>=2.0",
    "onnxruntime>=1.18",
]

[tool.uv]
package = false
